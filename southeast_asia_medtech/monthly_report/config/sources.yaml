    extract_fields: [title, published_date, body, url, matched_customer, products, facility_event, export_event, approval_event, financing_event, partnership_event]
    notes: First-party customer intelligence. Retain concrete manufacturing, investment, product, market-access, M&A, channel, sales or supply events; exclude CSR, awards and general thought leadership.

  - source_id: top20_customer_newsrooms_b
    source_name: TOP 20 Customer Official Newsrooms B
    country: GLOBAL
    organization: TOP 20 customer companies
    list_url: https://www.baxter.com/baxter-newsroom
    base_url: https://www.baxter.com
    source_type: customer_official
    workflow: customer_news
    category: customer_manufacturing_product_export_partnership
    priority: critical
    language: en
    enabled: false
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .card, .news-item, .teaser", title: "h2, h3, h4", date: "time, .date", article_link: "a[href]", body: "main, article, .content, .article-content"}
