  - Teleflex
  - Terumo
  - Ambu
  - Smith & Nephew
  - Baxter
  - Top Glove
  - Hollister
  - Nipro
  - Johnson & Johnson
  - ResMed
  - Hartalega
  - Careplus
  extract_fields:
  - title
  - published_date
  - body
  - url
  - company_name
  - product_name
  - registration_numbers
  - safety_event_type
  - affected_devices
  notes: Query and filter by watchlist company/product. Do not collect generic MDA
    policy unless a named company or product is directly affected.
