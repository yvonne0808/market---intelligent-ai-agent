    extract_fields: [title, published_date, body, url, company_name, filing_type, revenue, capex, facility_event, restructuring_event, financing_event, acquisition_event]
    notes: Company-filtered material disclosures only. Exclude ownership forms, routine governance and dividend notices unless they indicate a strategic transaction.

