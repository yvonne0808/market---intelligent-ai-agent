schema_version: '3.0'
module: southeast_asia_medtech
description: Customer-first Southeast Asia MedTech source registry focused on named
  customer, competitor, local-investment, commercialization, channel and supply-chain
  events.
country_tags:
  ASEAN:
    report_group: ASEAN Regional
    country_name: ASEAN Regional
  SG:
    report_group: Singapore
    country_name: Singapore
  MY:
    report_group: Malaysia
    country_name: Malaysia
  TH:
    report_group: Thailand
    country_name: Thailand
  ID:
    report_group: Indonesia
    country_name: Indonesia
  VN:
    report_group: Vietnam
    country_name: Vietnam
  PH:
    report_group: Philippines
    country_name: Philippines
  APAC:
    report_group: Regional / APAC
    country_name: Asia Pacific
  GLOBAL:
    report_group: Global Customer Intelligence
    country_name: Global
allowed_parsing_strategies:
- static_html
- sitemap
- rss
- api_json
- playwright
- custom_parser
allowed_workflows:
- news_listing
- registry_targeted
- packaging_news
- customer_news
- disclosure_monitor
- investment_news
- competitor_news
- channel_news
- press_release_search
defaults:
  report_frequency: monthly
  request_timeout_seconds: 25
  retries: 2
  polite_delay_seconds:
    min: 1.0
    max: 2.0
  respect_robots_txt: true
  max_items_per_source: 5
  store_raw_snapshot: true
sources:
- source_id: sg_hsa_announcements
  source_name: Singapore HSA Customer Safety Monitor
  country: SG
  organization: Health Sciences Authority
  list_url: https://www.hsa.gov.sg/announcements/
  base_url: https://www.hsa.gov.sg
  source_type: regulator_targeted
  workflow: registry_targeted
  category: customer_registration_recall_and_fsca
  priority: high
  language: en
  enabled: true
  parsing_strategy: custom_parser
  report_frequency: weekly
  requires_javascript: false
  selectors:
    article_card: a[href^='/announcements/']
    title: h3
    date: p
    article_link: a[href]
    body: main
  endpoints:
  - https://www.hsa.gov.sg/announcements/
  search_terms:
  - B. Braun
  - Ansell
  - BD
  - Becton Dickinson
  - Molnlycke
  - Teleflex
  - Terumo
  - Ambu
  - Smith & Nephew
  - Baxter
  - Hollister
  - Nipro
  - Johnson & Johnson
  - ResMed
  - medical device recall
  - field safety
  extract_fields:
  - title
  - published_date
  - body
  - url
  - company_name
  - product_name
  - registration_event
  - safety_event_type
  notes: Retain only named-customer/competitor registration, recall, FSCA or supply-impacting
    safety events. Exclude general guidance and consumer education.
