      - https://www.jnjmedtech.com/en-US/news/press-releases/
      - https://www.aurolab.com/news-and-events/
      - https://newsroom.resmed.com/
    search_terms: [Baxter, Hollister, Nipro, Johnson & Johnson, J&J MedTech, Ethicon, DePuy Synthes, Biosense Webster, Aurolab, ResMed, factory, facility, capacity, investment, acquisition, launch, approval, distribution, export, recall]
    extract_fields: [title, published_date, body, url, matched_customer, products, facility_event, export_event, approval_event, financing_event, partnership_event]
    notes: First-party customer intelligence; enforce watchlist aliases and concrete-event requirements.

  - source_id: malaysia_glove_customer_ir
    source_name: Malaysia Glove Customer IR and Announcements
    country: MY
    organization: Top Glove, Hartalega and Careplus
    list_url: https://www.topglove.com/investor-relations
    base_url: https://www.topglove.com
    source_type: customer_investor_relations
    workflow: disclosure_monitor
    category: customer_capacity_sales_investment_and_exports
    priority: critical
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .card, .announcement, tr", title: "h2, h3, a", date: "time, .date, td", article_link: "a[href]", body: "main, article, .content, body"}
    endpoints:
      - https://www.topglove.com/investor-relations
      # Hartalega's first-party announcements page exposes the full site
      # navigation as article candidates. Use its structured Insage feed below.
