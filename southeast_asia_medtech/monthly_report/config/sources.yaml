    title: h2, h3, .item-title, th.list-title
    date: time, .date, td.list-date
    article_link: a[href]
    body: .article-details, .item-page, main
  endpoints:
  - https://portal.mda.gov.my/index.php/profesional/safety-alert
  - https://portal.mda.gov.my/index.php/announcement
