schema_version: "3.0"
module: southeast_asia_medtech
description: Customer-first Southeast Asia MedTech source registry focused on named customer, competitor, local-investment, commercialization, channel and supply-chain events.

country_tags:
  ASEAN: {report_group: ASEAN Regional, country_name: ASEAN Regional}
  SG: {report_group: Singapore, country_name: Singapore}
  MY: {report_group: Malaysia, country_name: Malaysia}
  TH: {report_group: Thailand, country_name: Thailand}
  ID: {report_group: Indonesia, country_name: Indonesia}
  VN: {report_group: Vietnam, country_name: Vietnam}
  PH: {report_group: Philippines, country_name: Philippines}
  APAC: {report_group: Regional / APAC, country_name: Asia Pacific}
  GLOBAL: {report_group: Global Customer Intelligence, country_name: Global}

allowed_parsing_strategies: [static_html, sitemap, rss, api_json, playwright, custom_parser]
allowed_workflows:
  - news_listing
  - registry_targeted
  - packaging_news
  - customer_news
  - disclosure_monitor
  - investment_news
  - competitor_news
  - channel_news
  - press_release_search

defaults:
  report_frequency: monthly
  request_timeout_seconds: 25
  retries: 2
  polite_delay_seconds: {min: 1.0, max: 2.0}
  respect_robots_txt: true
  max_items_per_source: 5
  store_raw_snapshot: true

sources:
  # Retained regulatory sources are company-targeted safety/registration monitors,
  # not general policy feeds.
  - source_id: sg_hsa_announcements
    source_name: Singapore HSA Customer Safety Monitor
    country: SG
    organization: Health Sciences Authority
    list_url: https://www.hsa.gov.sg/announcements/
    base_url: https://www.hsa.gov.sg
    source_type: regulator_targeted
    workflow: registry_targeted
    category: customer_registration_recall_and_fsca
    priority: high
    language: en
    enabled: true
    parsing_strategy: custom_parser
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "a[href^='/announcements/']", title: "h3", date: "p", article_link: "a[href]", body: "main"}
    endpoints: [https://www.hsa.gov.sg/announcements/]
    search_terms: [B. Braun, Ansell, BD, Becton Dickinson, Molnlycke, Teleflex, Terumo, Ambu, Smith & Nephew, Baxter, Hollister, Nipro, Johnson & Johnson, ResMed, medical device recall, field safety]
    extract_fields: [title, published_date, body, url, company_name, product_name, registration_event, safety_event_type]
    notes: Retain only named-customer/competitor registration, recall, FSCA or supply-impacting safety events. Exclude general guidance and consumer education.

  - source_id: my_mda_mmdr
    source_name: Malaysia MDA Customer Safety Monitor
    country: MY
    organization: Medical Device Authority Malaysia
    list_url: https://portal.mda.gov.my/index.php/profesional/safety-alert
    base_url: https://portal.mda.gov.my
    source_type: regulator_targeted
    workflow: registry_targeted
    category: customer_registration_recall_and_fsca
    priority: high
    language: [en, ms]
    enabled: true
    parsing_strategy: custom_parser
    fallback_strategy: official_index_snapshot
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .blog-item, .item, tr", title: "h2, h3, .item-title, th.list-title", date: "time, .date, td.list-date", article_link: "a[href]", body: ".article-details, .item-page, main"}
    endpoints:
      - https://portal.mda.gov.my/index.php/profesional/safety-alert
      - https://portal.mda.gov.my/index.php/announcement
    search_terms: [B. Braun, Ansell, BD, Becton Dickinson, Molnlycke, Teleflex, Terumo, Ambu, Smith & Nephew, Baxter, Top Glove, Hollister, Nipro, Johnson & Johnson, ResMed, Hartalega, Careplus]
    extract_fields: [title, published_date, body, url, company_name, product_name, registration_numbers, safety_event_type, affected_devices]
    notes: Query and filter by watchlist company/product. Do not collect generic MDA policy unless a named company or product is directly affected.

  - source_id: th_fda_medical_devices
    source_name: Thailand FDA Customer Market-Access Monitor
    country: TH
    organization: Thai Food and Drug Administration
    list_url: https://en.fda.moph.go.th/news
    base_url: https://en.fda.moph.go.th
    source_type: regulator_targeted
    workflow: registry_targeted
    category: customer_registration_recall_and_market_access
    priority: medium
    language: [en, th]
    enabled: true
    parsing_strategy: custom_parser
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .news-item, .card, a[href*='/news/']", title: "h2, h3, h4, p", date: "time, .date", article_link: "a[href]", body: ".single__content.ql-editor"}
    endpoints:
      - https://en.fda.moph.go.th/news
      - "https://en.fda.moph.go.th/news?page=2"
    search_terms: [B. Braun, Ansell, BD, Becton Dickinson, Molnlycke, Teleflex, Terumo, Ambu, Smith & Nephew, Baxter, Nipro, Johnson & Johnson, ResMed, medical device recall]
    extract_fields: [title, published_date, body, url, company_name, product_name, regulatory_topic]
    notes: Customer-name and product-name monitoring only; exclude general reporting and policy education.

  - source_id: id_farmalkes_eregalkes
    source_name: Indonesia Farmalkes Customer and Local-Manufacturing Monitor
    country: ID
    organization: Directorate General of Pharmaceuticals and Medical Devices
    list_url: https://farmalkes.kemkes.go.id/
    base_url: https://farmalkes.kemkes.go.id
    source_type: regulator_and_industry
    workflow: investment_news
    category: local_investment_manufacturing_and_commercialization
    priority: high
    language: [id, en]
    enabled: true
    parsing_strategy: custom_parser
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .post, .card", title: "h2, h3", date: "time, .date", article_link: "a[href]", body: "main, article, .entry-content"}
    endpoints:
      - https://farmalkes.kemkes.go.id/
      - https://farmalkes.kemkes.go.id/artikel/berita-utama/
      - https://farmalkes.kemkes.go.id/artikel/berita-utama/page/2/
    search_terms: [B. Braun, BD, Becton Dickinson, Terumo, Baxter, Nipro, Johnson & Johnson, ResMed, produksi alat kesehatan, investasi, pabrik, ekspor, lokalisasi, kerja sama]
    extract_fields: [title, published_date, body, url, company_name, product_name, investment_value, facility_event, export_event, partnership_event]
    notes: Keep named-company investment, local manufacturing, export, business matching and commercialization. Exclude generic policy and events without a company outcome.

  - source_id: vn_vimda
    source_name: Vietnam VIMDA Customer Registration Monitor
    country: VN
    organization: Vietnam Infrastructure and Medical Device Administration
    list_url: https://vimda.moh.gov.vn/van-ban-cong-bo
    base_url: https://vimda.moh.gov.vn
    source_type: regulator_targeted
    workflow: registry_targeted
    category: customer_registration_and_market_access
    priority: medium
    language: vi
    enabled: true
    parsing_strategy: custom_parser
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, li, tr", title: "h2, h3, a", date: "time, .date, td", article_link: "a[href]", body: "main, article, .content"}
    endpoints: [https://vimda.moh.gov.vn/van-ban-cong-bo]
    search_terms: [B. Braun, Ansell, BD, Becton Dickinson, Molnlycke, Teleflex, Terumo, Ambu, Smith & Nephew, Baxter, Hollister, Nipro, Johnson & Johnson, ResMed]
    extract_fields: [title, published_date, body, url, company_name, product_name, document_number, registration_event]
    notes: Target company/product disclosures only. General legal documents and policy drafts are out of scope.

  - source_id: ph_fda_customer_monitor
    source_name: Philippines FDA Customer Registration and Safety Monitor
    country: PH
    organization: Food and Drug Administration Philippines
    list_url: https://verification.fda.gov.ph/Medical_Device_CMDNsrch.php
    base_url: https://verification.fda.gov.ph
    source_type: regulator_targeted
    workflow: registry_targeted
    category: customer_registration_recall_and_market_access
    priority: medium
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "tr, article, .post", title: "a, h2, h3", date: "td, time, .date", article_link: "a[href]", body: "body, main, article"}
    endpoints:
      - https://verification.fda.gov.ph/Medical_Device_CMDNsrch.php
      - https://www.fda.gov.ph/category/fda-advisories/
    search_terms: [B. Braun, Ansell, BD, Becton Dickinson, Molnlycke, Teleflex, Terumo, Ambu, Smith & Nephew, Baxter, Hollister, Nipro, Johnson & Johnson, Aurolab, ResMed]
    extract_fields: [title, published_date, body, url, company_name, product_name, registration_number, issuance_date, expiry_date, safety_event_type]
    notes: Incremental company-name search in the public verification portal plus named-company advisories. Never automate authenticated eServices.

  # Company-owned sources are split by website so each domain can declare its
  # own article URL shape. The old multi-domain groups remain below as disabled
  # migration references.
  - source_id: customer_bd_news
    source_name: BD Official Press Releases
    country: GLOBAL
    organization: Becton Dickinson
    list_url: https://news.bd.com/press-releases?l=50&o=0
    base_url: https://news.bd.com
    source_type: customer_official
    workflow: customer_news
    category: customer_product_commercialization_capacity_and_partnership
    priority: critical
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "li.wd_item, article, .wd_item", title: "a[href]", date: "time, .wd_date, .date", article_link: "a[href]", body: "main, article, .wd_body"}
    endpoints: ["https://news.bd.com/press-releases?l=50&o=0"]
    article_url_patterns: ["news\\.bd\\.com/2026-"]
    search_terms: [BD, Becton Dickinson, Pyxis, ChloraPrep, launch, authorization, approval, recall, contract, partnership, manufacturing, facility, capacity, investment, acquisition]
    extract_fields: [title, published_date, body, url, matched_customer, products, product_event, safety_event, partnership_event, facility_event]
    notes: Single-company first-party feed. Exclude awards, personnel-only items and earnings-call notices during downstream analysis.

  - source_id: customer_baxter_news
    source_name: Baxter Official News and Insights
    country: GLOBAL
    organization: Baxter
    list_url: https://www.baxter.com/news-insights
    base_url: https://www.baxter.com
    source_type: customer_official
    workflow: customer_news
    category: customer_product_commercialization_capacity_and_partnership
    priority: critical
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .views-row, .card", title: "h2, h3, a", date: "time, .date, .field--name-field-date", article_link: "a[href]", body: "main, article, .field--name-body"}
    endpoints: [https://www.baxter.com/news-insights]
    article_url_patterns: ["baxter\\.com/news-insights/[^?/#]+$"]
    search_terms: [Baxter, launch, approval, recall, manufacturing, facility, capacity, investment, acquisition, distribution, partnership, sales]
    extract_fields: [title, published_date, body, url, matched_customer, products, product_event, safety_event, partnership_event, facility_event]
    notes: First-party Baxter articles only; listing pages are rejected.

  - source_id: customer_resmed_news
    source_name: ResMed Official News Releases
    country: GLOBAL
    organization: ResMed
    list_url: https://newsroom.resmed.com/news-releases/
    base_url: https://newsroom.resmed.com
    source_type: customer_official
    workflow: customer_news
    category: customer_product_commercialization_capacity_and_partnership
    priority: critical
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .wd_item, .module_item", title: "h2, h3, a", date: "time, .wd_date, .date", article_link: "a[href]", body: "main, article, .wd_body"}
    endpoints: [https://newsroom.resmed.com/news-releases/]
    article_url_patterns: ["newsroom\\.resmed\\.com/news-releases/news-details/"]
    seed_articles:
      - title: Resmed Announces Agreement to Sell MatrixCare Business
        published_date: 07/07/2026
        url: https://newsroom.resmed.com/news-releases/news-details/2026/Resmed-Announces-Agreement-to-Sell-MatrixCare-Business/default.aspx
    search_terms: [ResMed, AirSense, AirCurve, Astral, launch, approval, recall, acquisition, divestiture, distribution, facility, investment, partnership]
    extract_fields: [title, published_date, body, url, matched_customer, products, product_event, safety_event, acquisition_event, partnership_event]
    notes: First-party ResMed releases only; include material portfolio transactions and product/safety events.

  - source_id: customer_smith_nephew_news
    source_name: Smith+Nephew Official News
    country: GLOBAL
    organization: Smith & Nephew
    list_url: https://www.smith-nephew.com/en/data/tabs/news?sc_mode=normal
    base_url: https://www.smith-nephew.com
    source_type: customer_official
    workflow: customer_news
    category: customer_product_commercialization_capacity_and_partnership
    priority: critical
    language: en
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, .card, li, .cmp-teaser", title: "h2, h3, h4, a", date: "time, .date", article_link: "a[href]", body: "main, article, .cmp-text"}
    endpoints: ["https://www.smith-nephew.com/en/data/tabs/news?sc_mode=normal"]
    article_url_patterns: ["smith-nephew\\.com/en/news/2026/07/"]
    seed_articles:
      - title: Smith+Nephew introduces groundbreaking LYNX COBLATION Laryngeal Wand for ENT surgeons
        published_date: 15 July 2026
        url: https://www.smith-nephew.com/en/news/2026/07/15/introduces-groundbreaking-lynx-coblation-laryngeal-wand
      - title: New German expert consensus provides first risk-based recommendations for sNPWT use in closed surgical incisions
        published_date: 6 July 2026
        url: https://www.smith-nephew.com/en/news/2026/07/06/new-german-expert-consensus-provides-first-risk-based-recommendations
    search_terms: [Smith+Nephew, Smith & Nephew, PICO, LYNX, CORI, launch, introduces, approval, acquisition, manufacturing, partnership, distribution]
    extract_fields: [title, published_date, body, url, matched_customer, products, product_event, commercialization_event, partnership_event]
    notes: First-party July article URLs only; clinical evidence is retained only when tied to a named commercial product.

  - source_id: customer_jnj_medtech_news
    source_name: Johnson & Johnson Medical Technology Press Releases
    country: GLOBAL
    organization: Johnson & Johnson MedTech
    list_url: https://www.jnj.com/media-center/press-releases/medical-technologies
    base_url: https://www.jnj.com
    source_type: customer_official
    workflow: customer_news
    category: customer_product_commercialization_capacity_and_partnership
    priority: critical
    language: en
    enabled: true
    parsing_strategy: playwright
    report_frequency: weekly
    requires_javascript: true
    selectors: {article_card: "article, .card, li, .result", title: "h2, h3, a", date: "time, .date", article_link: "a[href]", body: "main, article, .content"}
    endpoints: [https://www.jnj.com/media-center/press-releases/medical-technologies]
    article_url_patterns: ["jnj\\.com/media-center/press-releases/[^?/#]+$"]
    seed_articles:
      - title: Johnson & Johnson Receives FDA Market Authorization in the U.S. for its OTTAVA Robotic Surgical System
        published_date: 22 July 2026
        url: https://www.jnj.com/media-center/press-releases/johnson-johnson-receives-fda-market-authorization-in-the-u-s-for-its-ottava-robotic-surgical-system
      - title: Johnson & Johnson Announces FDA Approval for the Dual Energy THERMOCOOL SMARTTOUCH SF Platform
        published_date: 8 July 2026
        url: https://www.jnj.com/media-center/press-releases/johnson-johnson-announces-fda-approval-for-the-dual-energy-thermocool-smarttouch-sf-platform
    search_terms: [Johnson & Johnson, J&J MedTech, DePuy Synthes, Ethicon, Biosense Webster, OTTAVA, THERMOCOOL, launch, approval, authorization, acquisition, manufacturing, partnership]
    extract_fields: [title, published_date, body, url, matched_customer, products, approval_event, acquisition_event, commercialization_event]
    notes: Medical-technology topic feed only; pharmaceutical releases are excluded.

  - source_id: competitor_olympus_news
    source_name: Olympus Official Medical and Corporate News
    country: GLOBAL
    organization: Olympus
    list_url: https://www.olympus-global.com/news/release/
    base_url: https://www.olympus-global.com
    source_type: competitor_official
    workflow: competitor_news
    category: competitor_product_capacity_market_access_and_partnership
    priority: high
    language: [en, ja]
    enabled: true
    parsing_strategy: static_html
    report_frequency: weekly
    requires_javascript: false
    selectors: {article_card: "article, li, .news-list-item", title: "h2, h3, a", date: "time, .date", article_link: "a[href]", body: "main, article, .content"}
    endpoints:
      - https://www.olympus-global.com/news/release/
      - https://olycojp.olympus-global.com/news/
    article_url_patterns: ["olympus-global\\.com/news/2026/", "olycojp\\.olympus-global\\.com/news/2026/"]
    search_terms: [Olympus, medical device, endoscopy, factory, facility, supply, launch, approval, recall, acquisition, distribution]
    extract_fields: [title, published_date, body, url, competitor_company, products, facility_event, product_event, approval_event, partnership_event]
    notes: Competes with Ambu and other endoscopy customers; retain product, capacity, safety and channel events.

