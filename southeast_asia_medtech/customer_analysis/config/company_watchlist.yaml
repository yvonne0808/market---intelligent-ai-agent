schema_version: "1.2"
description: Customer-first Southeast Asia MedTech watchlist. Canonical names, verified Southeast Asia footprints, aliases, product segments and evidence-based competitor mappings are maintained separately from source URLs and prompt rules.

southeast_asia_footprint_metadata:
  definition: Countries with a verified local entity, office, regional headquarters, manufacturing site or other established operating presence. Export-only markets are excluded.
  country_code_format: ISO 3166-1 alpha-2
  allowed_country_codes: [SG, MY, TH, ID, VN, PH]
  empty_list_meaning: No qualifying Southeast Asia operating presence verified yet.
  article_event_country_field: report_countries

customer_relevance_values:
  - direct_customer
  - competitor
  - potential_customer_or_partner
  - industry_only
  - none

