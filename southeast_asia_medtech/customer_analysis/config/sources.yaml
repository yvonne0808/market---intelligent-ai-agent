schema_version: '3.0'
module: southeast_asia_medtech
description: Customer-first Southeast Asia MedTech source registry focused on named
  customer, competitor, local-investment, commercialization, channel and supply-chain
  events.
country_tags:
  ASEAN:
    report_group: ASEAN Regional
    country_name: ASEAN Regional
  SG:
    report_group: Singapore
    country_name: Singapore
  MY:
    report_group: Malaysia
    country_name: Malaysia
  TH:
    report_group: Thailand
    country_name: Thailand
  ID:
    report_group: Indonesia
    country_name: Indonesia
  VN:
    report_group: Vietnam
    country_name: Vietnam
  PH:
    report_group: Philippines
    country_name: Philippines
  APAC:
    report_group: Regional / APAC
    country_name: Asia Pacific
  GLOBAL:
    report_group: Global Customer Intelligence
    country_name: Global
allowed_parsing_strategies:
- static_html
- sitemap
- rss
- api_json
- playwright
- custom_parser
allowed_workflows:
- news_listing
- registry_targeted
- packaging_news
- customer_news
- disclosure_monitor
- investment_news
- competitor_news
- channel_news
- press_release_search
defaults:
  report_frequency: monthly
  request_timeout_seconds: 25
  retries: 2
  polite_delay_seconds:
    min: 1.0
    max: 2.0
  respect_robots_txt: true
  max_items_per_source: 5
  store_raw_snapshot: true
sources:
- source_id: customer_bd_news
  source_name: BD Official Press Releases
  country: GLOBAL
  organization: Becton Dickinson
  list_url: https://news.bd.com/press-releases?l=50&o=0
  base_url: https://news.bd.com
  source_type: customer_official
  workflow: customer_news
  category: customer_product_commercialization_capacity_and_partnership
  priority: critical
  language: en
  enabled: true
  parsing_strategy: static_html
  report_frequency: weekly
  requires_javascript: false
  selectors:
    article_card: li.wd_item, article, .wd_item
    title: a[href]
    date: time, .wd_date, .date
    article_link: a[href]
    body: main, article, .wd_body
  endpoints:
  - https://news.bd.com/press-releases?l=50&o=0
  article_url_patterns:
  - news\.bd\.com/2026-
  search_terms:
  - BD
  - Becton Dickinson
  - Pyxis
  - ChloraPrep
  - launch
  - authorization
  - approval
  - recall
  - contract
  - partnership
  - manufacturing
  - facility
  - capacity
  - investment
  - acquisition
  extract_fields:
  - title
  - published_date
  - body
  - url
  - matched_customer
  - products
  - product_event
  - safety_event
  - partnership_event
  - facility_event
  notes: Single-company first-party feed. Exclude awards, personnel-only items and
    earnings-call notices during downstream analysis.
- source_id: customer_baxter_news
  source_name: Baxter Official News and Insights
  country: GLOBAL
  organization: Baxter
  list_url: https://www.baxter.com/news-insights
  base_url: https://www.baxter.com
  source_type: customer_official
  workflow: customer_news
  category: customer_product_commercialization_capacity_and_partnership
  priority: critical
  language: en
  enabled: true
  parsing_strategy: static_html
  report_frequency: weekly
  requires_javascript: false
  selectors:
    article_card: article, .views-row, .card
    title: h2, h3, a
    date: time, .date, .field--name-field-date
    article_link: a[href]
    body: main, article, .field--name-body
  endpoints:
  - https://www.baxter.com/news-insights
  article_url_patterns:
  - baxter\.com/news-insights/[^?/#]+$
  search_terms:
  - Baxter
  - launch
  - approval
  - recall
  - manufacturing
  - facility
  - capacity
  - investment
  - acquisition
  - distribution
  - partnership
  - sales
  extract_fields:
  - title
  - published_date
  - body
  - url
  - matched_customer
  - products
  - product_event
  - safety_event
  - partnership_event
  - facility_event
  notes: First-party Baxter articles only; listing pages are rejected.
